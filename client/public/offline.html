<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F3C88" />
    <title>Offline — SSV School</title>
    <style>
      :root { --primary: #1F3C88; --bg: #F5F6FA; --text: #333333; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 380px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      }
      .logo {
        width: 72px; height: 72px; border-radius: 18px;
        background: var(--primary); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; font-weight: 800; margin: 0 auto 20px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; color: var(--primary); }
      p { font-size: 15px; line-height: 1.5; color: #555; margin: 0 0 24px; }
      button {
        font-size: 16px; font-weight: 600; color: #fff;
        background: var(--primary); border: none; border-radius: 10px;
        padding: 12px 24px; min-height: 44px; cursor: pointer; width: 100%;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">S</div>
      <h1>You're offline</h1>
      <p>SSV School can't reach the network right now. Check your connection and try again — pages you've already opened may still be available.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
